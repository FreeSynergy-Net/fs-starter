[workspace]
resolver = "2"
members = ["crates/fs-starter", "crates/fs-starter-host"]

[workspace.package]
version = "0.0.4"
authors = ["FreeSynergy <support@freesynergy.net>"]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/FreeSynergy/fs-starter"

# sq1a: local head of fs-forms (until the bundled release)
[patch."https://github.com/FreeSynergy/fs-forms"]
fs-forms-run = { git = "https://github.com/FreeSynergy-Net/fs-forms", branch = "unreviewed/sq1a-exit-code" }
