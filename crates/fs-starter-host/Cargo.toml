[package]
name = "fs-starter-host"
description = "The host: `fs-starter --description PATH` opens the window of a program from its description (blueprint folder, forms/ folder or one file), without building the program"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "fs_starter_host"

# The binary a person (or the program's launcher) starts. Its name is the name of the repository.
[[bin]]
name = "fs-starter"
path = "src/main.rs"

# Only git tags and the sibling crate. `fs-forms-run` v0.0.11 (the window of a description) brings fs-components v0.0.34, fs-forms-client
# (fs-rpc v0.0.7, fs-interfaces v0.0.31 via fs-forms-run) and the description reader; `fs-forms-bin` is NOT a dependency (it depends on `fs-starter`: a cycle).
[dependencies]
fs-starter = { path = "../fs-starter" }
fs-types = { git = "https://github.com/FreeSynergy/fs-types", tag = "v0.0.4" }
fs-forms-run = { git = "https://github.com/FreeSynergy/fs-forms", tag = "v0.0.11" }
fs-forms-bind = { git = "https://github.com/FreeSynergy/fs-forms", tag = "v0.0.11" }
toml = "0.8"
# The exchange file of a module (`catalog/commands.json` of fs-capture); already in the lock.
serde_json = "1"
# The command model (no dependencies of its own); the same tag as the one the scaffold settings come from (one source, lock check).
fs-components-commands = { git = "https://github.com/FreeSynergy/fs-components", tag = "v0.0.34" }
# Single instance (ADR 0097): the contract `Instance` of fs-interfaces, served and called through fs-rpc (the same pins as fs-forms-run).
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.31" }
fs-rpc = { git = "https://github.com/FreeSynergy/fs-rpc", tag = "v0.0.7" }
capnp = "0.27"
capnp-rpc = "0.27"
tokio = { version = "1", features = ["rt", "sync", "time", "net"] }

# O_NOFOLLOW for opening the file of a set (unix only; already in the lock).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Test support: a fake module service (`FormSource`, made-up groups data), see its first lines. It is an EXAMPLE, not a `[[bin]]`: a release build
# (`cargo build --release`, cargo-deb, cargo-generate-rpm, cargo-wix) never builds or lists it, `cargo test` builds it next to the test binaries
# (`target/<profile>/examples/`, found by `tests/support/install.rs`). It is not a package asset.
[[example]]
name = "fs-starter-fake-module"
path = "examples/fake_module.rs"

# Picture tests: the host binary draws the window without a window (`--picture`), the test reads the PNG back.
[dev-dependencies]
tempfile = "3"
png = "0.18"

# RPM (cargo-generate-rpm, built by the release CI only). The package is called `fs-starter` (the host crate keeps its name) and replaces the
# earlier `fs-starter-host` package; nothing requires the old name (checked: fs-tasks 0.0.10 and fs-blueprint require only `fs-starter`).
# Known gap (0.0.6): the package does NOT own the system folders every program and module package puts files in (paths = fs_starter::SHARE_DIR, PROGRAMS_DIR,
# MODULES_DIR; frontends/). Directory ownership follows as soon as cargo-generate-rpm can build `dir = true` assets (0.21.1 fails with ENOENT: it passes an
# empty source path to `PackageBuilder::with_file`); upstream PR <link follows>. rpm creates the parent folders implicitly (root, 755); fs-starter trusts the
# system level only for root-owned, not world-writable folders and files, not for the package owner.
[package.metadata.generate-rpm]
name = "fs-starter"
assets = [
  { source = "target/release/fs-starter", dest = "/usr/bin/fs-starter", mode = "755" },
]

[package.metadata.generate-rpm.obsoletes]
fs-starter-host = "*"
