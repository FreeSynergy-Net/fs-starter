[package]
name = "fs-starter-host"
description = "The host: `fs-starter --description PATH` opens the window of a program from its description (blueprint folder, forms/ folder or one file), without building the program"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "fs_starter_host"

# The binary a person (or the program's launcher) starts. Its name is the name of the repository.
[[bin]]
name = "fs-starter"
path = "src/main.rs"

# Only git pins (rev of the landed heads, until the tags exist) and the sibling crate. `fs-forms-run` 0.1.0 (the window of a description) brings fs-components, fs-forms-client
# (fs-rpc, fs-interfaces: the same revs as here, one source each) and the description reader; `fs-forms-bin` is NOT a dependency (it depends on `fs-starter`: a cycle).
[dependencies]
fs-starter = { path = "../fs-starter", version = "0.0.8" }
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
fs-forms-run = { git = "https://github.com/FreeSynergy-Net/fs-forms", rev = "c270e2904ae120475fc3e367bf213ae6d1633380", version = "0.1.0" }
fs-forms-bind = { git = "https://github.com/FreeSynergy-Net/fs-forms", rev = "c270e2904ae120475fc3e367bf213ae6d1633380", version = "0.1.0" }
toml = "0.8"
# The one reader of module versions (`Version`), already in the lock; ranges are `fs_types::interface::InterfaceReq`.
semver = "1.0.28"
# The exchange file of a module (`catalog/commands.json` of fs-capture); already in the lock.
serde_json = "1"
# The command model (no dependencies of its own); the same tag as the one the scaffold settings come from (one source, lock check).
fs-components-commands = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "233c920831a1399df3eb54b5e2054409655453f3", version = "0.1.0" }
# Single instance (ADR 0097): the contract `Instance` of fs-interfaces, served and called through fs-rpc (the same pins as fs-forms-run).
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "a395979b5df2fbff91347bf10b3324a2e1bfa33d", version = "0.2.0" }
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "9aff426a37cfbaec657b9164c1b11389c6d1712b", version = "0.1.4" }
# The client of the settings service (E3): `ensure_service` + `RpcSettingsStore`. Same repo and rev as fs-rpc (one source).
fs-settings-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "9aff426a37cfbaec657b9164c1b11389c6d1712b", version = "0.1.4" }
# `Settings::open`, `Catalog`, `CatalogFile` (E1): the same rev as fs-starter.
fs-settings = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "233c920831a1399df3eb54b5e2054409655453f3", version = "0.1.0" }
# Same file as an open handle (Unix: device + inode, Windows: volume + file index); instead of an own `same_file`. Already in the lock.
same-file = "1"
fs-components-kanban = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "233c920831a1399df3eb54b5e2054409655453f3", version = "0.1.0" }
capnp = "0.27"
capnp-rpc = "0.27"
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "net"] }

# O_NOFOLLOW for opening the file of a set (unix only; already in the lock).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Test support: a fake module service (`FormSource`, made-up groups data), see its first lines. It is an EXAMPLE, not a `[[bin]]`: a release build
# (`cargo build --release`, cargo-deb, cargo-generate-rpm, cargo-wix) never builds or lists it, `cargo test` builds it next to the test binaries
# (`target/<profile>/examples/`, found by `tests/support/install.rs`). It is not a package asset.
[[example]]
name = "fs-starter-fake-module"
path = "examples/fake_module.rs"

# Picture tests: the host binary draws the window without a window (`--picture`), the test reads the PNG back.
[dev-dependencies]
# The tests use `SystemPlaces::for_test` (the feature only here: a program never builds its own circle of trust).
fs-starter = { path = "../fs-starter", version = "0.0.8", features = ["test-support"] }
tempfile = "3"
png = "0.18"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
# Conformance suite of the contract module_v1 and its fake (fs-module of fs-interfaces 0.2.0; the same source as fs-interfaces above, checked in the lock).
fs-module = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "a395979b5df2fbff91347bf10b3324a2e1bfa33d", version = "0.2.0" }

# The real planning service in this process (Unix only: its tests use a Unix socket); every library on the same tag as above (one source each).
[target.'cfg(unix)'.dev-dependencies]
fs-modules-planning = { git = "https://github.com/FreeSynergy-Net/fs-modules-planning", rev = "c54c85162ebd85499bb8cbad8c4e59c4949d0ad8", version = "0.0.4" }
fs-tasks-core = { git = "https://github.com/FreeSynergy-Net/fs-modules-planning", rev = "c54c85162ebd85499bb8cbad8c4e59c4949d0ad8", version = "0.0.4" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11", features = ["testing"] }

# RPM (cargo-generate-rpm, built by the release CI only). The package is called `fs-starter` (the host crate keeps its name) and replaces the
# earlier `fs-starter-host` package; nothing requires the old name (checked: fs-tasks 0.0.10 and fs-blueprint require only `fs-starter`).
# The package does not own the system folders (paths = fs_starter::SHARE_DIR, PROGRAMS_DIR, MODULES_DIR; frontends/): the package `freesynergy-filesystem` owns them (INST-5, Repository) and this one `Requires` it. fs-starter trusts the
# system level only for root-owned, not world-writable folders and files, not for the package owner.
[package.metadata.generate-rpm]
name = "fs-starter"
assets = [
  { source = "target/release/fs-starter", dest = "/usr/bin/fs-starter", mode = "755" },
  { source = "packaging/net.freesynergy.Starter.desktop", dest = "/usr/share/applications/net.freesynergy.Starter.desktop", mode = "644" },
  { source = "packaging/net.freesynergy.Starter.metainfo.xml", dest = "/usr/share/metainfo/net.freesynergy.Starter.metainfo.xml", mode = "644" },
  # The icon is fetched from fs-icons by packaging/prepare.sh before the build (one source, no copy here).
  { source = "packaging/net.freesynergy.Starter.svg", dest = "/usr/share/icons/hicolor/scalable/apps/net.freesynergy.Starter.svg", mode = "644" },
]

# The system folders every program and module package puts files in are owned by the package `freesynergy-filesystem` (Repository, INST-5); this package does not own them, it requires the package that does.
[package.metadata.generate-rpm.requires]
freesynergy-filesystem = "*"

[package.metadata.generate-rpm.obsoletes]
fs-starter-host = "*"

# DEB (cargo-deb, built by the release CI only). Same name as the RPM: `fs-starter` (cargo-deb would take the crate name `fs-starter-host`). From 0.0.8 on
# the deb replaces the earlier `fs-starter-host` package (0.0.4 .. 0.0.7): Replaces (takes over its files), Conflicts (apt removes it on the upgrade),
# Provides (whatever might depend on the old name stays satisfied). `tests/package_names.rs` and `package-probe.yml` keep deb and rpm on one name.
[package.metadata.deb]
name = "fs-starter"
replaces = "fs-starter-host"
conflicts = "fs-starter-host"
provides = "fs-starter-host"
# Assets: the binary, the desktop entry, the AppStream metainfo and the hicolor icon (`packaging/`, paths relative to this crate). Giving `assets`
# replaces cargo-deb's default list, so the binary is named here too. The icon file comes from fs-icons (`packaging/prepare.sh`).
assets = [
  ["target/release/fs-starter", "usr/bin/", "755"],
  ["../../packaging/net.freesynergy.Starter.desktop", "usr/share/applications/", "644"],
  ["../../packaging/net.freesynergy.Starter.metainfo.xml", "usr/share/metainfo/", "644"],
  ["../../packaging/net.freesynergy.Starter.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
