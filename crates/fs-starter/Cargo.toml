[package]
name = "fs-starter"
description = "The program shell of every FreeSynergy program: words, server gate, frontend pick from AppStream manifests, start, exit codes; plus an optional conformance suite"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# `SystemPlaces::for_test` (an own circle of trust). Only dev-dependencies switch it on, never a program.
test-support = ["fs-trusted-path/test-support"]
# The suite `starter` (rules + bench + mutants). Never in `default`: fs-conformance stays out of the normal graph (review A4).
conformance = ["dep:fs-conformance", "dep:async-trait"]

[dependencies]
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "459c1e8d1226896cca53c3140f5aa912f43a5305", version = "0.1.4" }
# The check of one part of a way "is this the system's" (Unix and Windows), one module for all programs (WIN-HOST WH3). Same repo as fs-rpc, rev 11cdf714.
fs-trusted-path = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "459c1e8d1226896cca53c3140f5aa912f43a5305", version = "0.1.4" }
# `coded` (error codes with typed parameters) comes from here (`fs_types::coded`).
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
# The scaffold declares its own settings (ADR 0100 item 3); the library comes from fs-components, one tag.
fs-settings = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "508a25f3915270e28ea6a306411fa336e563d9e1", version = "0.1.0" }
capnp = "0.27"
tokio = { version = "1", features = ["rt"] }
# New in this repo (already used by fs-packages-catalog); MIT OR Apache-2.0, no dependencies of its own.
roxmltree = "0.20"
# The one reader of versions (`Version`); `fs_types::interface` reads the needs (`name@<req>`). Already in the lock (fs-types).
semver = "1.0.28"
# fs-conformance lives in the repo fs-types; the same rev as fs-types in fs-rpc (one source per library, lock check).
fs-conformance = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7", optional = true }
async-trait = { version = "0.1", optional = true }

[target.'cfg(windows)'.dependencies]
# The anchor of the system places: the known folder `FOLDERID_ProgramFiles` (never the environment variable). Already in the lock (fs-trusted-path).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
# Its own tests use `SystemPlaces::for_test`.
fs-starter = { path = ".", version = "0.0.8", features = ["test-support"] }
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
