# Package probe: builds the same Linux (deb, rpm, tar.gz, arch) and Windows (zip, msi) packages as release.yml, with the same inputs and the same
# pinned fs-release parts, but NEVER finalizes, signs, tags or publishes (no `finalize`/`publish`/`library` job, `contents: read` only).
# Runs on a push of a `unreviewed/release-pins-*` branch (and `unreviewed/deb-name`) and by hand. The job `names` checks the BUILT deb and rpm: both must be called like the program (`fs-starter`) and take over `fs-starter-host`. Keep `inputs` equal to release.yml (checked by eye in review).
name: package-probe
on:
  push: { branches: ["unreviewed/release-pins-*", "unreviewed/deb-name"] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        uses: FreeSynergy-Net/fs-release/actions/plan@9eed5c95eb7311f2b68266a012ec778f51e3ac38
        with:
          # the Cargo version of this branch as the tag name (no tag exists; tag-on-main does nothing on a branch). ADJUST this line at every version bump.
          tag: v0.0.7
          binaries: fs-starter
          cargo-package: fs-starter-host
          name: fs-starter
          kind: app
          app-id: net.freesynergy.Starter
          macos: "false"
          windows-targets: x86_64
  linux:
    needs: plan
    uses: FreeSynergy-Net/fs-release/.github/workflows/_release-linux.yml@9eed5c95eb7311f2b68266a012ec778f51e3ac38
    with:
      plan: ${{ needs.plan.outputs.plan }}
  windows:
    needs: plan
    uses: FreeSynergy-Net/fs-release/.github/workflows/_release-windows.yml@9eed5c95eb7311f2b68266a012ec778f51e3ac38
    with:
      plan: ${{ needs.plan.outputs.plan }}
  # Gate: the names inside the built packages (not the manifest) are the same for deb and rpm, and both take over the earlier `fs-starter-host`.
  names:
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist
      - name: deb and rpm carry one name
        env:
          PROGRAM: fs-starter
          OLD: fs-starter-host
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq --no-install-recommends rpm >/dev/null
          debs=(dist/*.deb); rpms=(dist/*.rpm)
          [[ ${#debs[@]} -eq 1 && -e ${debs[0]} ]] || { echo "::error::expected exactly one .deb in dist: ${debs[*]}"; exit 1; }
          [[ ${#rpms[@]} -eq 1 && -e ${rpms[0]} ]] || { echo "::error::expected exactly one .rpm in dist: ${rpms[*]}"; exit 1; }
          deb=$(dpkg-deb -f "${debs[0]}" Package); rpm=$(rpm -qp --qf '%{NAME}' "${rpms[0]}")
          echo "deb: $deb ($(basename "${debs[0]}"))  rpm: $rpm ($(basename "${rpms[0]}"))"
          [[ $deb == "$PROGRAM" ]] || { echo "::error::deb is called $deb, not $PROGRAM"; exit 1; }
          [[ $rpm == "$PROGRAM" ]] || { echo "::error::rpm is called $rpm, not $PROGRAM"; exit 1; }
          for f in Replaces Conflicts Provides; do
            dpkg-deb -f "${debs[0]}" "$f" | tr ',' '\n' | grep -qx "[[:space:]]*$OLD[[:space:]]*" || { echo "::error::deb $f does not name $OLD"; exit 1; }
          done
          rpm -qp --obsoletes "${rpms[0]}" | grep -q "^$OLD\b" || { echo "::error::rpm does not obsolete $OLD"; exit 1; }
          echo "ok: deb and rpm are both $PROGRAM and take over $OLD"
